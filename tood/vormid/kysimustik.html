<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
  <link rel="stylesheet" href="vormStyle.css">
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
  <!-- c + tab komentaar -->
  <table border="1">
    <tr>
      <td>
        <!-- Tekstkast -->
        <label for="nimi">Nimi:</label>
      </td>
      <td>
        <input type="text" id="nimi" placeholder="Irina">
      </td>
    </tr>
    <tr>
      <td>
        <!-- ripploend või rippmenüü -->
        <label for="stiil">Vali meeldivaim muusikastiil:</label>
      </td>
      <td>
        <select name="stiil" id="stiil">
          <option value="vali">vali..</option>
          <option value="hiphop">hiphop</option>
          <option value="kantri">kantri</option>
          <option value="rock">rock</option>
          <option value="metal">metal</option>
          <option value="jazz">jazz</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <!-- radio nupud -üks valik mitmest -->
        <strong>
          Kuidas sa muusikat peamiselt kuulad?
        </strong>
      </td>
      <td>
        <input type="radio" name="platvorm" id="spotify">
        <label for="spotify">Spotify</label>
        <br>
        <input type="radio" name="platvorm" id="raadio">
        <label for="raadio">raadio</label>
        <br>
        <input type="radio" name="platvorm" id="vinüülplaat">
        <label for="vinüülplaat">vinüülplaat</label>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <!-- checkbox - markerruut -->
        <fieldset>
          <legend>Tee oma valikud - lemmik ansambel</legend>
          <input type="checkbox" name="lemmikud" id="rollingstones">
          <label for="rollingstones">Rolling stones</label>
          <br>
          <input type="checkbox" name="lemmikud" id="systemofdown">
          <label for="systemofdown">System of Down</label>
          <br>
          <input type="checkbox" name="lemmikud" id="metallica">
          <label for="metallica">Metallica</label>
          <br>
        </fieldset>
      </td>
    </tr>
    <tr>
      <td>
        <!-- range - vahemik -->
        <label for="tund">
          Mitu tundi päevas sa kuulad muusikat?
        </label>
      </td>
      <td>
         0<input type="range" id="tund" min="0" max="24" value="">24
      </td>
    </tr>
    <tr>
      <td> Input type=color, file, email, jne kokku 5-6tk</td>
      <td>w3schools.com</td>
    </tr>

  </table>




</form>
</body>
</html>
